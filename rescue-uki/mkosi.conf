[Output]
ImageId=arch-rescue
Format=uki
OutputDirectory=mkosi.output
CompressOutput=false
SplitArtifacts=uki

[Build]
History=false
Incremental=no

[Distribution]
Distribution=arch

[Content]
Hostname=arch-rescue
Bootloader=none
Bootable=false
Timezone=UTC
RootShell=/bin/bash
Keymap=us
Locale=C.UTF-8
MicrocodeHost=false
KernelModulesExclude=.*
KernelModulesInclude=
    fs/
    hid/
    input/
    dm-.*
    crypto/
    tpm/
    virtio
    usb/
    net/
    nvme
    vmd
    ata/
    scsi/
    mmc/
Packages=
    base
    linux-lts
    linux-firmware
    amd-ucode
    intel-ucode
    arch-install-scripts
    btrfs-progs
    curl
    cryptsetup
    efibootmgr
    iptables
    libfido2
    pciutils
    sbctl
    snapper
    tpm2-tss
    tzdata
    rsync
    gum
    iwd
    util-linux
    dosfstools
    vim
    less
    man-pages
    mandoc
KernelCommandLine=
# mkosi.extra/ is picked up automatically. These add the rescue command and
# the reinstall payload (package lists, settings, shared installer code)
# straight from the repository; build.sh adds the payload-version stamp.
ExtraTrees=
    ../iso/airootfs/usr/local/bin/rescue-root:/usr/local/bin/rescue-root
    ../packages:/usr/local/share/arch-new-install/packages
    ../settings:/usr/local/share/arch-new-install/settings
    ../installer-common.bash:/usr/local/share/arch-new-install/installer-common.bash
RemoveFiles=
    /efi/
    /usr/include/
    /usr/share/include
    /usr/share/pkgconfig
    /usr/lib/**/*.a
    /usr/share/locale
    /var/lib/pacman/sync/*
