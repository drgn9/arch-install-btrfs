# Intel Management Engine Interface: the host-side drivers for talking to the
# ME. Blocking them removes local attack surface. It does not switch off AMT's
# out-of-band network access, which the firmware provides without an OS driver.
# blacklist suppresses alias/autoload; install /bin/false blocks explicit modprobe.
blacklist mei
install mei /bin/false

blacklist mei_me
install mei_me /bin/false

blacklist mei_hdcp
install mei_hdcp /bin/false

blacklist mei_pxp
install mei_pxp /bin/false
