# Environment
env=QT_QPA_PLATFORMTHEME,gtk3
env=XDG_SESSION_TYPE,wayland
env=XCURSOR_THEME,Adwaita
env=XCURSOR_SIZE,24

# Outputs: keep the laptop at scale 2; leave other output modes automatic.
monitor_rule=name:^eDP-1$,scale:2,x:0,y:0
cursor_theme=Adwaita
cursor_size=24

# Float the Impala terminal.
window_rule=is_floating:1,app_id:^float-app$

# Application shortcuts
bind=SUPER+SHIFT,Return,spawn,foot
bind=SUPER+SHIFT,i,spawn,foot -a float-app impala
bind=SUPER,p,spawn,fuzzel
bind=SUPER,o,toggleoverview
bind=SUPER+SHIFT,c,killclient
bind=SUPER+CTRL,r,reload_config

# Layouts: cycle the current tag, or return directly to Deck.
bind=SUPER,n,switch_layout
bind=SUPER+SHIFT,n,setlayout,deck

# Launch on first use, then show/hide the same terminal with Super+backtick.
window_rule=is_named_scratchpad:1,app_id:^mango-scratchpad$
bind=SUPER,grave,toggle_named_scratchpad,mango-scratchpad,none,foot --app-id mango-scratchpad

# Vim-style focus and movement
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+CTRL,h,scroller_stack,left
bind=SUPER+CTRL,l,scroller_stack,right

# Monitors
bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right
bind=SUPER+SHIFT,comma,tagmon,left
bind=SUPER+SHIFT,period,tagmon,right

# Tags: numbered moves leave focus on the source tag, like Niri.
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9
